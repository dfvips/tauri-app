name: release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
            artifact_suffix: windows-x64
            bundle: false
          - platform: windows-latest
            target: i686-pc-windows-msvc
            args: --target i686-pc-windows-msvc
            artifact_suffix: windows-x86
            bundle: false
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc
            artifact_suffix: windows-arm64
            bundle: false
          - platform: macos-26-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            artifact_suffix: mac-x64
            bundle: true
          - platform: macos-26
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            artifact_suffix: mac-arm64
            bundle: true

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - id: cfg
        name: Read config
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const config = JSON.parse(fs.readFileSync("app.config.json", "utf8"));
          const name = String(config.name || "App").replace(/[\r\n]+/g, " ").trim();
          const safe = name
            .replace(/[\\/:*?"<>|]/g, "_")
            .replace(/[：]/g, "_")
            .trim() || "App";
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${name}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `APP_NAME=${name}\nSAFE_APP_NAME=${safe}\n`);
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm install

      - name: Set Windows temp product name
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP_PRODUCT_NAME=bundle"
          Add-Content -Path $env:GITHUB_ENV -Value "RENAME_BASE_NAME=bundle"

      - name: Apply config
        run: npm run apply-config

      - name: Import macOS signing certificate
        if: startsWith(matrix.platform, 'macos')
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            echo "Missing MACOS_CERTIFICATE_P12_BASE64 secret."
            exit 1
          fi
          if [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
            echo "Missing MACOS_CERTIFICATE_PASSWORD secret."
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/macos_cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/macos_signing.keychain-db"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -n 1 | awk '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "No code signing identity found."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build (bundle)
        if: matrix.bundle
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Build (no bundle)
        if: ${{ !matrix.bundle }}
        run: npm run tauri build -- ${{ matrix.args }} --no-bundle

      - name: Rename bundles
        if: matrix.bundle
        run: node scripts/release-assets.mjs --suffix ${{ matrix.artifact_suffix }} --out bundle-files.txt --copy-dir release-assets --bundle-dir src-tauri/target/${{ matrix.target }}/release/bundle

      - name: Keep only dmg
        if: matrix.bundle
        shell: bash
        run: |
          find release-assets -type f ! -name "*.dmg" -delete

      - name: Collect exe
        if: ${{ !matrix.bundle }}
        shell: bash
        run: |
          mkdir -p release-assets
          EXE="src-tauri/target/${{ matrix.target }}/release/tauri-webapp-wrapper.exe"
          if [ ! -f "$EXE" ]; then
            echo "Exe not found: $EXE"
            exit 1
          fi
          cp "$EXE" "release-assets/bundle-${{ matrix.artifact_suffix }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - id: cfg
        name: Read config
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const config = JSON.parse(fs.readFileSync("app.config.json", "utf8"));
          const name = String(config.name || "App").replace(/[\r\n]+/g, " ").trim();
          const safe = name
            .replace(/[\\/:*?"<>|]/g, "_")
            .replace(/[：]/g, "_")
            .trim() || "App";
          const version = String(config.version || "0.0.0").replace(/[\r\n]+/g, " ").trim();
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${name}\nversion=${version}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `APP_NAME=${name}\nSAFE_APP_NAME=${safe}\n`);
          NODE

      - id: meta
        name: Build release tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="${{ steps.cfg.outputs.version }}"
          TAG="v${VERSION}-${SHORT_SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Rename assets to safe app name
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const safeName = process.env.SAFE_APP_NAME || "App";
          const dist = path.resolve("dist");
          if (!fs.existsSync(dist)) {
            console.error("dist not found");
            process.exit(1);
          }
          const files = fs.readdirSync(dist);
          for (const file of files) {
            let next = null;
            if (file.startsWith("bundle-")) {
              next = `${safeName}-${file.slice("bundle-".length)}`;
            }
            if (!next) continue;
            fs.renameSync(path.join(dist, file), path.join(dist, next));
          }
          NODE

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          APP_NAME: ${{ steps.cfg.outputs.name }}
          VERSION: ${{ steps.cfg.outputs.version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          TITLE="${APP_NAME} ${VERSION} (${SHORT_SHA})"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TITLE" --notes "Automated build." --target "$GITHUB_SHA"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [ ! -d dist ]; then
            echo "No artifacts downloaded."
            exit 1
          fi
          if ! find dist -type f \( -name "*.dmg" -o -name "*.exe" \) -print -quit | grep -q .; then
            echo "No files to upload."
            exit 1
          fi
          find dist -type f \( -name "*.dmg" -o -name "*.exe" \) -print0 | while IFS= read -r -d '' file; do
            gh release upload "$TAG" "$file" --clobber
          done
