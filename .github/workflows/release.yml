name: release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
            artifact_suffix: windows-x64
          - platform: windows-latest
            target: i686-pc-windows-msvc
            args: --target i686-pc-windows-msvc
            artifact_suffix: windows-x86
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc
            artifact_suffix: windows-arm64
          - platform: macos-26-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            artifact_suffix: mac-x64
          - platform: macos-26
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            artifact_suffix: mac-arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm install

      - name: Apply config
        run: npm run apply-config

      - name: Build
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Rename bundles
        run: node scripts/release-assets.mjs --suffix ${{ matrix.artifact_suffix }} --out bundle-files.txt --copy-dir release-assets --bundle-dir src-tauri/target/${{ matrix.target }}/release/bundle

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.artifact_suffix }}
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - id: cfg
        name: Read config
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const config = JSON.parse(fs.readFileSync("app.config.json", "utf8"));
          const name = String(config.name || "App").replace(/[\r\n]+/g, " ").trim();
          const version = String(config.version || "0.0.0").replace(/[\r\n]+/g, " ").trim();
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${name}\nversion=${version}\n`);
          NODE

      - id: meta
        name: Build release tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="${{ steps.cfg.outputs.version }}"
          TAG="v${VERSION}-${SHORT_SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          APP_NAME: ${{ steps.cfg.outputs.name }}
          VERSION: ${{ steps.cfg.outputs.version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          TITLE="${APP_NAME} ${VERSION} (${SHORT_SHA})"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TITLE" --notes "Automated build." --target "$GITHUB_SHA"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [ ! -d dist ]; then
            echo "No artifacts downloaded."
            exit 1
          fi
          if ! find dist -type f -print -quit | grep -q .; then
            echo "No files to upload."
            exit 1
          fi
          find dist -type f -print0 | while IFS= read -r -d '' file; do
            gh release upload "$TAG" "$file" --clobber
          done
